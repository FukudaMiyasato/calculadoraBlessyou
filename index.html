<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calculadora +/-</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #1c1c1e;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    padding: 16px;
  }
  .app {
    width: 100%;
    max-width: 420px;
    background: #2c2c2e;
    border-radius: 20px;
    padding: 20px;
    box-shadow: 0 10px 40px rgba(0,0,0,.5);
  }
  .panel {
    background: #000;
    color: #fff;
    border-radius: 14px;
    padding: 24px 20px;
    text-align: right;
    font-size: 56px;
    font-weight: 300;
    margin-bottom: 16px;
    min-height: 96px;
    overflow-wrap: anywhere;
  }
  .ops {
    display: flex;
    gap: 12px;
    margin-bottom: 16px;
  }
  .op {
    flex: 1;
    padding: 18px;
    font-size: 32px;
    font-weight: 600;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    color: #fff;
    background: #3a3a3c;
    transition: background .15s, transform .05s;
  }
  .op.active { background: #ff9500; }
  .op:active { transform: scale(.96); }
  .grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
    margin-bottom: 16px;
  }
  .num {
    padding: 18px 0;
    font-size: 22px;
    font-weight: 500;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    color: #fff;
    background: #3a3a3c;
    transition: background .15s, transform .05s;
  }
  .num:hover { background: #48484a; }
  .num:active { transform: scale(.94); }
  .clear {
    width: 100%;
    padding: 16px;
    font-size: 18px;
    font-weight: 600;
    border: none;
    border-radius: 14px;
    cursor: pointer;
    color: #fff;
    background: #d33;
    transition: background .15s;
  }
  .clear:hover { background: #e44; }
</style>
</head>
<body>
  <div class="app">
    <div class="panel" id="panel">0</div>
    <div class="ops">
      <button class="op active" id="opPlus" data-op="+">+</button>
      <button class="op" id="opMinus" data-op="-">&minus;</button>
    </div>
    <div class="grid" id="grid"></div>
    <button class="clear" id="clear">Limpiar</button>
  </div>

<script>
  const amounts = [1,2,3,4,5,6,7,10,12,16,17,19,24,28,32,34,53,57,192];
  let total = 0;
  let op = "+";

  const panel = document.getElementById("panel");
  const grid = document.getElementById("grid");
  const opPlus = document.getElementById("opPlus");
  const opMinus = document.getElementById("opMinus");

  function render() {
    panel.textContent = total.toLocaleString("es");
  }

  function setOp(newOp) {
    op = newOp;
    opPlus.classList.toggle("active", op === "+");
    opMinus.classList.toggle("active", op === "-");
  }

  opPlus.addEventListener("click", () => setOp("+"));
  opMinus.addEventListener("click", () => setOp("-"));

  amounts.forEach(n => {
    const b = document.createElement("button");
    b.className = "num";
    b.textContent = n;
    b.addEventListener("click", () => {
      total += (op === "+" ? n : -n);
      render();
    });
    grid.appendChild(b);
  });

  document.getElementById("clear").addEventListener("click", () => {
    total = 0;
    render();
  });

  render();
</script>
</body>
</html>
